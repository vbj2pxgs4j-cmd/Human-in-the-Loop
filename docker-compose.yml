version: '3.8'

services:
  hitl-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hitl-backend-app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENV=production
      - LOG_LEVEL=INFO
      - AUDIT_LOG_PATH=/app/data/audit/audit_diff_log.json
      - CANONICAL_STORE_PATH=/app/data/explainers/canonical_store.json
      - SUPPORT_API_KEY=${SUPPORT_API_KEY}
      - WHITELISTED_DOMAINS=platform.in,sebi.gov.in,nseindia.com,bseindia.com,cdslindia.com
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
